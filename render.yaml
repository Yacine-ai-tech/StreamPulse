# Render Blueprint — disaster-recovery / one-click redeploy. Builds from ./Dockerfile (honors $PORT),
# health-checks /health. All sensitive values must be set in Cloud provider dashboard (sync: false).
# Runs on standard PaaS providers. STREAMPULSE_HYBRID_LLM=1 + an LLM key enables Claude zero-shot escalation
# for the classifier (keyword/embedding fast-paths work without it).
services:
  - type: web
    name: streampulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEBHOOK_SECRET        # HMAC-SHA256 verification for POST /webhook/{source}
        sync: false
      - key: STREAMPULSE_HYBRID_LLM
        value: "1"
      - key: DOCINTEL_URL          # for /webhook/{src}/with-vision composition
        sync: false
      - key: N8N_BASE_URL
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: POSTGRES_URL          # dedicated PostgreSQL database for persistence (recommended for production)
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INTERNAL_TOKEN  # REQUIRED: must match gateway
        sync: false
      - key: REQUIRE_INTERNAL_TOKEN
        value: "false"
      - key: TELEMETRY_OPT_OUT
        value: "false"
