name: Production Health Verification

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Service Health
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          url = "https://streampulse.ysiddo-ai-projects.app/health"
          last = None
          for attempt in range(1, 6):
              req = urllib.request.Request(url, headers={"User-Agent": "streampulse-ci-health/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print(f"Production service responded HTTP {resp.status}")
                      print(body[:400])
                      if resp.status == 200:
                          sys.exit(0)
              except urllib.error.HTTPError as err:
                  last = err.code
                  edge = "cf-ray" in {k.lower() for k in err.headers.keys()} or \
                      "cloudflare" in (err.headers.get("server", "") or "").lower()
                  print(f"Attempt {attempt}: HTTP {err.code}")
                  if err.code == 403 and edge:
                      print("::notice::The edge denied the GitHub-hosted runner; the service is monitored from the gateway.")
                      sys.exit(0)
              except Exception as exc:  # network error, timeout
                  last = type(exc).__name__
                  print(f"Attempt {attempt}: request failed ({last})")
              time.sleep(5)
          print(f"Health check failed (last result: {last})")
          sys.exit(1)
          PY
