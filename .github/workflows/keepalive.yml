name: Keep Render App Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s -f -o /dev/null "https://streampulse.ysiddo-ai-projects.app/health" || echo "Ping failed but continuing"
